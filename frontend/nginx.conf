server {
    listen 80;
    server_name _;

    # Allow large PDF uploads through the proxy
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve static assets, fall back to index.html for client routing
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy to the Chat Agent service (trailing slashes strip the /api/rag prefix)
    location /api/rag/ {
        proxy_pass http://chat:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Reverse proxy to the ingestion service (trailing slashes strip the /api/ingest prefix)
    location /api/ingest/ {
        proxy_pass http://ingestion:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
