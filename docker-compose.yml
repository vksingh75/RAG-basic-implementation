# RAG-basic-implementation stack
# Six services on the default compose network — service names double as DNS
# hostnames (postgres, qdrant, ingestion, retrieval, chat, frontend).
# All configuration comes from .env (copy .env.example -> .env first).
# No secrets are hardcoded here.

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    env_file: .env
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    ports:
      - "6333:6333"
    # The qdrant image ships no curl/wget, so probe TCP readiness on 6333 via
    # bash's /dev/tcp redirect. If the image ever drops bash, the fallback is
    # to remove this healthcheck and switch ingestion/retrieval depends_on to
    # `condition: service_started` while relying on service-side retry logic.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' && exec 3>&-"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build: ./services/ingestion
    env_file: .env
    environment:
      OMP_NUM_THREADS: 4
    ports:
      - "${INGESTION_PORT:-8002}:8002"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # start_period is generous: first boot downloads the ~2.2GB
    # intfloat/multilingual-e5-large model into the shared hf_cache volume.
    # python:3.12-slim ships no curl/wget — probe /health with stdlib urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s

  retrieval:
    build: ./services/retrieval
    env_file: .env
    environment:
      OMP_NUM_THREADS: 4
    ports:
      - "${RETRIEVAL_PORT:-8003}:8003"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # start_period is generous: first boot downloads the ~2.2GB
    # intfloat/multilingual-e5-large model into the shared hf_cache volume.
    # python:3.12-slim ships no curl/wget — probe /health with stdlib urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s

  chat:
    build: ./services/chat
    env_file: .env
    environment:
      OMP_NUM_THREADS: 4
    ports:
      - "${CHAT_PORT:-8001}:8001"
    # No hf_cache volume: chat has no embedder — retrieval owns the embedding model.
    depends_on:
      postgres:
        condition: service_healthy
      # retrieval healthy means the embedder is loaded, so /chat can serve.
      retrieval:
        condition: service_healthy
    # Fast boot (no model download) — python:3.12-slim ships no curl/wget,
    # so probe /health with stdlib urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # nginx proxies at request time, so service_started is sufficient here.
    depends_on:
      ingestion:
        condition: service_started
      chat:
        condition: service_started

volumes:
  pgdata:
  qdrant_data:
  hf_cache:
